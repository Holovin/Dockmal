name: Build

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Test and build the app
        run: bash build.sh

      - name: Run packaging tests
        run: bash Tests/build-script-tests.sh

      # ditto keeps the bundle's ad-hoc signature and symlinks intact.
      - name: Archive the app
        run: ditto -c -k --keepParent build/Dockmal.app Dockmal.zip

      - uses: actions/upload-artifact@v7
        with:
          path: Dockmal.zip
          archive: false
          if-no-files-found: error
